```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Dashboard - My Blog</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .dashboard-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .dashboard-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .blog-card {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            overflow-wrap: anywhere;
        }

        .blog-card h3 {
            margin-top: 0;
        }

        .blog-card button {
            margin: 8px 6px 0 0;
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .view-btn { background: #2563eb; color: white; }
        .edit-btn { background: #eab308; color: black; }
        .delete-btn { background: #dc2626; color: white; }

        .status-message {
            margin: 20px 0;
        }

        .error-message {
            color: #dc2626;
        }

        .success-message {
            color: #15803d;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar">
            <h1>My Blog</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="create-blog.html">Create Blog</a>
                <a href="login.html" id="loginLink">Login</a>
                <button type="button" id="logoutBtn">Logout</button>
            </div>
        </nav>
    </header>

    <main class="dashboard-container">
        <div class="dashboard-top">
            <div>
                <h2>Blog Dashboard</h2>
                <p>Total Blogs: <strong id="totalBlogs">0</strong></p>
            </div>

            <a href="create-blog.html" class="btn">+ Create New Blog</a>
        </div>

        <p id="statusMessage" class="status-message">
            Loading blogs...
        </p>

        <section id="dashboardBlogs" class="blog-grid"></section>
    </main>

    <footer>
        <p style="text-align:center;">© 2026 My Blog Application</p>
    </footer>

    <script>
        const API_URL = "http://localhost:5000/api";

        const totalBlogsElement = document.getElementById("totalBlogs");
        const statusMessage = document.getElementById("statusMessage");
        const dashboardBlogs = document.getElementById("dashboardBlogs");

        async function loadBlogs() {
            statusMessage.textContent = "Loading blogs...";
            statusMessage.className = "status-message";
            dashboardBlogs.replaceChildren();

            try {
                const response = await fetch(`${API_URL}/blogs`);
                const result = await response.json();

                console.log("Blogs API response:", result);

                if (!response.ok) {
                    throw new Error(result.message || "Could not load blogs.");
                }

                const blogs = Array.isArray(result)
                    ? result
                    : result.blogs;

                if (!Array.isArray(blogs)) {
                    throw new Error("Blog list was not found in the API response.");
                }

                totalBlogsElement.textContent = blogs.length;

                if (blogs.length === 0) {
                    statusMessage.textContent =
                        "No blogs found. Click Create New Blog to add one.";
                    return;
                }

                statusMessage.textContent = "";

                blogs.forEach(function (blog) {
                    const card = document.createElement("article");
                    card.className = "blog-card";

                    const title = document.createElement("h3");
                    title.textContent = blog.title || "Untitled Blog";

                    const category = document.createElement("p");
                    category.textContent =
                        "Category: " + (blog.category || "General");

                    const author = document.createElement("p");
                    author.textContent =
                        "Author: " + (blog.author || "Anonymous");

                    const excerpt = document.createElement("p");
                    const text = blog.excerpt || blog.content || "";
                    excerpt.textContent =
                        text.length > 150 ? text.substring(0, 150) + "..." : text;

                    const viewButton = document.createElement("button");
                    viewButton.textContent = "View";
                    viewButton.className = "view-btn";
                    viewButton.type = "button";
                    viewButton.addEventListener("click", function () {
                        alert(
                            (blog.title || "Untitled Blog") +
                            "\n\n" +
                            (blog.content || "No content available.")
                        );
                    });

                    const editButton = document.createElement("button");
                    editButton.textContent = "Edit";
                    editButton.className = "edit-btn";
                    editButton.type = "button";
                    editButton.addEventListener("click", function () {
                        editBlog(blog);
                    });

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete-btn";
                    deleteButton.type = "button";
                    deleteButton.addEventListener("click", function () {
                        deleteBlog(blog);
                    });

                    card.append(
                        title,
                        category,
                        author,
                        excerpt,
                        viewButton,
                        editButton,
                        deleteButton
                    );

                    dashboardBlogs.appendChild(card);
                });

            } catch (error) {
                console.error("Dashboard error:", error);
                totalBlogsElement.textContent = "0";
                statusMessage.textContent =
                    "Unable to load blogs: " + error.message;
                statusMessage.className =
                    "status-message error-message";
            }
        }

        async function editBlog(blog) {
            const id = blog._id || blog.id;

            if (!id) {
                alert("Blog ID not found.");
                return;
            }

            const newTitle = prompt("Enter blog title:", blog.title || "");
            if (newTitle === null) return;

            const newContent = prompt(
                "Enter blog content:",
                blog.content || ""
            );
            if (newContent === null) return;

            if (!newTitle.trim() || !newContent.trim()) {
                alert("Title and content cannot be empty.");
                return;
            }

            try {
                const response = await fetch(
                    `${API_URL}/blogs/${encodeURIComponent(id)}`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: newTitle.trim(),
                            content: newContent.trim(),
                            category: blog.category || "General",
                            excerpt: blog.excerpt || "",
                            author: blog.author || "Anonymous"
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || result.success === false) {
                    throw new Error(result.message || "Blog update failed.");
                }

                alert("Blog updated successfully!");
                await loadBlogs();

            } catch (error) {
                console.error("Edit error:", error);
                alert("Could not update blog: " + error.message);
            }
        }

        async function deleteBlog(blog) {
            const id = blog._id || blog.id;

            if (!id) {
                alert("Blog ID not found.");
                return;
            }

            const confirmed = confirm(
                'Are you sure you want to delete "' +
                (blog.title || "this blog") + '"?'
            );

            if (!confirmed) return;

            try {
                const response = await fetch(
                    `${API_URL}/blogs/${encodeURIComponent(id)}`,
                    { method: "DELETE" }
                );

                const result = await response.json();

                if (!response.ok || result.success === false) {
                    throw new Error(result.message || "Blog deletion failed.");
                }

                alert("Blog deleted successfully!");
                await loadBlogs();

            } catch (error) {
                console.error("Delete error:", error);
                alert("Could not delete blog: " + error.message);
            }
        }

        document.getElementById("logoutBtn").addEventListener("click", function () {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "login.html";
        });

        loadBlogs();
    </script>
</body>
</html>
```
